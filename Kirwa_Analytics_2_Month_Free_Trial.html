<!-- KIRWA ANALYTICS SUBSCRIPTION EXTENSION -->
<script>
/* KIRWA_SUBSCRIPTIONS_V2
   New schools receive a 60-day free school subscription trial from account creation.
   After the trial: KSh 150 per registered learner / 30 days.
   Learner: KSh 30 / 30 days. Parent: KSh 30 / 30 days.
   Paid subscriptions activate only after the HTTPS backend verifies the Daraja payment.
*/
(function(){
  const SCHOOL_RATE=150, INDIVIDUAL_RATE=30, PERIOD_DAYS=30, TRIAL_DAYS=60;
  const oldKInit=window.kInit;
  window.kInit=function(s){
    s=oldKInit(s);
    s.subscriptions=s.subscriptions||{school:null,learners:{},parents:{},payments:[]};
    s.subscriptions.learners=s.subscriptions.learners||{};
    s.subscriptions.parents=s.subscriptions.parents||{};
    s.subscriptions.payments=s.subscriptions.payments||[];
    // Existing schools are not silently granted a new trial; only account creation sets trial dates.
    s.paymentConfig=s.paymentConfig||{};
    return s;
  };
  function save(s){kSave(s)}
  function allLearners(s){
    const out=[]; Object.entries(s.classes||{}).forEach(([cn,c])=>Object.values(c.students||{}).forEach(st=>{if(!out.some(x=>x.adm===st.adm))out.push({...st,className:cn})}));
    (s.students||[]).forEach(st=>{if(!out.some(x=>x.adm===st.adm))out.push(st)}); return out;
  }
  function expiryActive(rec){return !!(rec&&rec.status==='paid'&&rec.expiresAt&&Date.now()<new Date(rec.expiresAt).getTime())}
  function expiryText(rec){return expiryActive(rec)?new Date(rec.expiresAt).toLocaleString():'Not active'}
  function trialActive(s){const end=s.subscriptions?.trialEndsAt;return !!(end&&Date.now()<new Date(end).getTime()&&!expiryActive(s.subscriptions?.school))}
  function trialDaysLeft(s){const end=s.subscriptions?.trialEndsAt;if(!end)return 0;return Math.max(0,Math.ceil((new Date(end).getTime()-Date.now())/86400000))}
  function schoolActive(s){return expiryActive(s.subscriptions?.school)||trialActive(s)}
  function schoolExpiryText(s){return expiryActive(s.subscriptions?.school)?expiryText(s.subscriptions.school):(trialActive(s)?new Date(s.subscriptions.trialEndsAt).toLocaleString():'Not active')}
  function individualRecord(s,role){
    if(role==='LEARNER')return s.subscriptions.learners[current.learnerAdm]||null;
    if(role==='PARENT')return s.subscriptions.parents[current.email]||null;
    return null;
  }
  function individualActive(s,role){return expiryActive(individualRecord(s,role))}
  function roleIsStaff(role){return !['LEARNER','PARENT'].includes(role)}
  function paymentEndpoint(s){return s.paymentConfig?.endpoint||''}
  function subscriptionCard(s,kind){
    const count=allLearners(s).length, amount=kind==='school'?count*SCHOOL_RATE:INDIVIDUAL_RATE;
    const rec=kind==='school'?s.subscriptions.school:individualRecord(s,current.role);
    const active=kind==='school'?schoolActive(s):expiryActive(rec), onTrial=kind==='school'&&trialActive(s), daysLeft=onTrial?trialDaysLeft(s):0;
    const id=kind==='school'?'school':(current.role==='LEARNER'?current.learnerAdm:current.email);
    const title=kind==='school'?'School subscription':'Your '+(current.role==='LEARNER'?'learner':'parent')+' subscription';
    return `<section class="card kirwa-payment-panel" style="border:2px solid #0284c7;margin-top:14px">
      <h2>💳 ${title}</h2>
      ${kind==='school'?`<div class="kirwa-cards"><div class="stat"><b>${count}</b>Registered learners</div><div class="stat"><b>KSh ${amount.toLocaleString()}</b>Monthly amount due (150 × learners)</div></div>`:`<div class="stat"><b>KSh 30</b>Monthly access subscription</div>`}
      <p style="margin:10px 0"><b>Status:</b> ${onTrial?'FREE 2-MONTH TRIAL — '+daysLeft+' day(s) remaining':(active?'PAID — access active':'PAYMENT REQUIRED')}<br><b>${onTrial?'Free trial ends':'Expiry'}:</b> ${kind==='school'?schoolExpiryText(s):expiryText(rec)}</p>
      ${kind==='school'&&onTrial?`<div class="alert"><b>Your school subscription is free during this trial.</b><br>After the trial, the monthly charge will be KSh ${SCHOOL_RATE} × ${count} registered learners = <b>KSh ${amount.toLocaleString()}</b> per month. Learner and parent subscriptions are separate.</div>`:''}
      ${onTrial?'':`<label>M-PESA phone number</label><input id="ksubPhone" inputmode="tel" placeholder="07XXXXXXXX or 2547XXXXXXXX">
      ${kind==='school'?'<label>Payment description</label><input value="Kirwa Analytics school subscription" disabled>':''}
      ${!paymentEndpoint(s)?`<label>Secure Daraja API endpoint (developer configuration)</label><input id="ksubEndpoint" type="url" placeholder="https://your-domain.co.ke/api/mpesa/subscription"><button class="secondary" onclick="kSubSaveEndpoint()">Save secure payment endpoint</button>`:''}
      <button onclick="kSubPay('${kind}','${encodeURIComponent(String(id))}',${amount})">${active?'Renew subscription':'Pay subscription'} — KSh ${amount.toLocaleString()}</button>`}
      <div id="ksubStatus" class="kirwa-muted" style="margin-top:8px" aria-live="polite"></div>
      <div class="kirwa-security-note">Access is unlocked only after the secure server verifies the M-PESA callback. Do not put Daraja secrets or passkeys in this HTML file.</div>
    </section>`;
  }
  window.kSubSaveEndpoint=function(){
    if(!['HOE','HOS','PRINCIPAL'].includes(current.role))return alert('Only authorised school administrators can configure the payment endpoint.');
    const endpoint=document.getElementById('ksubEndpoint')?.value.trim()||'';
    if(!/^https:\/\/.+/i.test(endpoint))return alert('Enter a valid HTTPS endpoint.');
    const s=school();s.paymentConfig=s.paymentConfig||{};s.paymentConfig.endpoint=endpoint;save(s);render();msg('Secure M-PESA endpoint saved. Backend configuration is still required.');
  };
  window.kSubPay=async function(kind,idEnc,amount){
    const s=school(),endpoint=paymentEndpoint(s),phone=document.getElementById('ksubPhone')?.value.trim()||'',status=document.getElementById('ksubStatus');
    if(kind==='school'&&trialActive(s))return alert('Your school is still in its 2-month free trial. No school subscription payment is due yet.');
    if(!endpoint)return alert('The secure M-PESA endpoint has not been configured.');
    if(!/^https:\/\/.+/i.test(endpoint))return alert('The payment endpoint must use HTTPS.');
    if(!/^((\+?254)|0)7\d{8}$/.test(phone))return alert('Enter a valid Kenyan Safaricom phone number.');
    if(!Number.isInteger(amount)||amount<1)return alert('There are no registered learners to bill yet, or the amount is invalid.');
    const target=decodeURIComponent(idEnc);
    const targetKind=kind==='school'?'school':(current.role==='LEARNER'?'learner':'parent');
    const payload={action:'stkpush',purpose:targetKind+'_subscription',schoolCode:current.code,accountReference:target,phone,amount,currency:'KES',periodDays:PERIOD_DAYS,learnerCount:kind==='school'?allLearners(s).length:undefined};
    status.textContent='Sending secure M-PESA STK request…';
    try{
      const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||data.success!==true||!data.requestId){status.textContent=data.message||'The server did not accept the payment request. No subscription was activated.';return;}
      s.subscriptions.pending=s.subscriptions.pending||{};s.subscriptions.pending[data.requestId]={kind:targetKind,target,amount,createdAt:new Date().toISOString(),phone};save(s);
      status.textContent='STK prompt sent. Complete the payment on your phone, then tap Verify Payment below.';
      const btn=document.createElement('button');btn.className='success';btn.textContent='Verify M-PESA Payment';btn.onclick=()=>kSubVerify(data.requestId);status.appendChild(document.createElement('br'));status.appendChild(btn);
    }catch(e){status.textContent='Could not reach the payment server. No payment or subscription was recorded.';}
  };
  window.kSubVerify=async function(requestId){
    const s=school(),endpoint=paymentEndpoint(s),status=document.getElementById('ksubStatus');
    if(!endpoint)return alert('Payment endpoint missing.');
    if(status)status.textContent='Checking verified payment status…';
    try{
      const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',requestId,schoolCode:current.code})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||data.verified!==true||data.status!=='paid'){
        if(status)status.textContent=data.message||'Payment is not yet verified. The subscription remains locked. Try verification again after completing the STK prompt.';return;
      }
      const pending=s.subscriptions.pending?.[requestId];if(!pending)return alert('This payment request is not recognised on this device. Contact school support.');
      const paidAt=data.paidAt?new Date(data.paidAt):new Date();
      const expiry=new Date(paidAt);expiry.setDate(expiry.getDate()+PERIOD_DAYS);
      const rec={status:'paid',amount:pending.amount,paidAt:paidAt.toISOString(),expiresAt:expiry.toISOString(),receipt:data.receipt||data.mpesaReceiptNumber||'',requestId,verifiedByServer:true};
      if(pending.kind==='school')s.subscriptions.school=rec;
      else if(pending.kind==='learner')s.subscriptions.learners[pending.target]=rec;
      else s.subscriptions.parents[pending.target]=rec;
      s.subscriptions.payments.push({kind:pending.kind,account:pending.target,...rec});delete s.subscriptions.pending[requestId];save(s);
      if(status)status.textContent='Payment verified by the server. Subscription activated until '+expiry.toLocaleString()+'.';
      render();msg('M-PESA payment verified. Subscription access is now active.');
    }catch(e){if(status)status.textContent='Unable to verify with the payment server. No access was unlocked.';}
  };

  const oldPage=window.kPage;
  window.kPage=function(s){
    s=kInit(s);
    if(KIRWA_TAB==='dashboard'){
      let html=oldPage(s);
      if(current.role==='HOS'||current.role==='HOE'||current.role==='PRINCIPAL') html+=subscriptionCard(s,'school');
      if(current.role==='LEARNER'||current.role==='PARENT') html+=subscriptionCard(s,'individual');
      return html;
    }
    if(roleIsStaff(current.role)&&!schoolActive(s)&&!['setup','students','accounts'].includes(KIRWA_TAB))
      return `<div class="card"><h2>School subscription expired</h2><p>School management functions are locked until the HOS renews the school subscription. School setup and learner registration remain available.</p>${subscriptionCard(s,'school')}</div>`;
    if((current.role==='LEARNER'||current.role==='PARENT')&&(!schoolActive(s)||!individualActive(s,current.role)))
      return `<div class="card"><h2>Panel locked — subscription required</h2><p>Your school and personal subscription must both be active to use this panel.</p>${!schoolActive(s)?'<p>Ask the HOS to renew the school subscription.</p>':''}${subscriptionCard(s,'individual')}</div>`;
    return oldPage(s);
  };
  const oldGo=window.kGo;
  window.kGo=function(tab){
    const s=kInit(school());
    if(roleIsStaff(current.role)&&!schoolActive(s)&&!['dashboard','setup','students','accounts'].includes(tab)){
      alert('School subscription required. The HOS must renew it before this function can be used.');KIRWA_TAB='dashboard';render();return;
    }
    if((current.role==='LEARNER'||current.role==='PARENT')&&(!schoolActive(s)||!individualActive(s,current.role))&&tab!=='dashboard'){
      alert('Your panel is locked until the school and your personal subscription are active.');KIRWA_TAB='dashboard';render();return;
    }
    return oldGo(tab);
  };

  /* Enforce the same checks on direct function calls, not only navigation. */
  function requireSchool(){if(schoolActive(kInit(school())))return true;alert('School subscription expired. Ask the HOS to pay the monthly school subscription.');return false}
  ['kAddStaff','kSaveResults','kLoadResults','kCreateExam','kCreateHomework','kRecordFee','kAddPayroll','kMarkAttendance','kAddBook','kAddDiscipline'].forEach(name=>{
    const fn=window[name];if(typeof fn==='function')window[name]=function(...args){if(!['HOE','HOS','PRINCIPAL'].includes(current.role)&&!requireSchool())return;return fn.apply(this,args)};
  });
  const oldLogin=window.login;
  window.login=function(){
    oldLogin();
    if(!current.role)return;
    const s=kInit(school());
    if(roleIsStaff(current.role)&&!schoolActive(s)&&!['HOE','HOS','PRINCIPAL'].includes(current.role)){
      alert('School subscription is not active. Ask the HOS to renew it.');logout();return;
    }
    if(current.role==='LEARNER'&&!schoolActive(s)){alert('The school subscription is not active. Contact the HOS.');logout();return;}
    if(current.role==='PARENT'&&!schoolActive(s)){alert('The school subscription is not active. Contact the HOS.');logout();return;}
    if(current.role==='LEARNER'&&!individualActive(s,'LEARNER')){KIRWA_TAB='dashboard';render();}
    if(current.role==='PARENT'&&!individualActive(s,'PARENT')){KIRWA_TAB='dashboard';render();}
  };
})();
</script>
