<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kirwa Analytics - Advanced School Platform</title>
<style>
:root{--primary:#0284c7;--primary-dark:#0369a1;--secondary:#0f172a;--success:#16a34a;--warning:#ea580c;--danger:#dc2626;--light:#f8fafc;--border:#cbd5e1}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#f1f5f9;color:var(--secondary);padding-bottom:50px;min-height:100vh}header{background:var(--secondary);color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:1.3rem;box-shadow:0 4px 6px #0002}.logo-box{font-size:1.8rem;margin-bottom:5px}.container{width:95%;max-width:1200px;margin:15px auto}.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 6px -1px #0002;margin-bottom:15px;border:1px solid #e2e8f0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.form-group{margin-bottom:12px}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:#475569}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;background:#fff}button{background:var(--primary);color:#fff;padding:11px 15px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin:3px 0}button:hover{background:var(--primary-dark)}button.secondary{background:#64748b}button.danger{background:var(--danger)}button.success{background:var(--success)}button.small{width:auto;padding:7px 10px;font-size:.8rem}.nav-controls{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.nav-btn{width:auto;background:#e2e8f0;color:var(--secondary)}.nav-tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);margin:12px 0}.tab-btn{width:auto;background:none;color:#64748b;white-space:nowrap;border-radius:0}.tab-btn.active{color:var(--primary);border-bottom:3px solid var(--primary)}.hidden{display:none!important}.alert{padding:12px;border-radius:8px;margin-bottom:12px;background:#e0f2fe;color:#0369a1}.badge{padding:4px 9px;border-radius:12px;font-size:.75rem;font-weight:700;color:#fff;background:var(--success)}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.85rem;background:#fff}th,td{border:1px solid var(--border);padding:8px;text-align:left}th{background:#f1f5f9}tr:nth-child(even){background:#f8fafc}.table-wrap{overflow-x:auto}.muted{color:#64748b;font-size:.85rem}.stat{padding:14px;border:1px solid var(--border);border-radius:9px;background:#f8fafc}.stat b{font-size:1.35rem;display:block;color:var(--primary)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.section-title{margin-bottom:10px;color:var(--primary)}
.report-ee1{border:5px double #15803d;background:#f0fdf4}.report-ee2{border:5px double #0f766e;background:#f0fdfa}.report-me{border:5px solid #2563eb;background:#eff6ff}.report-ae{border:5px solid #d97706;background:#fffbeb}.report-be{border:5px solid #64748b;background:#f8fafc}.release-head{text-align:center;border-bottom:3px double #334155;padding:12px;margin-bottom:12px}.release-foot{margin-top:24px;display:flex;justify-content:space-between}.pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#e2e8f0;font-weight:bold}.report-sheet{padding:22px;border-radius:12px;page-break-after:always}.report-sheet h2,.report-sheet h3{text-align:center;margin:8px}.report-sheet table{font-size:12px}.report-sheet th{background:#dbeafe}.report-sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}@media print{body{background:#fff}.report-sheet{box-shadow:none;break-after:page}}
</style></head><body>
<header><div class="logo-box">📊✨🦅</div><div>KIRWA ANALYTICS</div><p style="font-size:.8rem;font-weight:400;opacity:.9;margin-top:3px">Next-Generation Educational Assessment Matrix Platform</p></header>
<div class="container"><div class="nav-controls"><button class="nav-btn" onclick="goBack()">⬅️ Back View</button><button class="nav-btn" onclick="goForward()">Forward View ➡️</button></div><div id="notice" class="alert hidden"></div>
<section id="auth" class="card"><h2 style="text-align:center;margin-bottom:7px">Welcome to Kirwa Analytics</h2><p class="muted" style="text-align:center;margin-bottom:15px">School assessment, marks processing and performance analytics.</p><div class="nav-tabs"><button id="loginTab" class="tab-btn active" onclick="showAuth('login')">Existing Account Sign-In</button><button id="regTab" class="tab-btn" onclick="showAuth('register')">Create School Account (HOE First)</button></div>
<div id="loginPanel"><div class="form-group"><label>Workspace Portal Role</label><select id="loginRole"><option value="HOE">Head of Examination (HOE)</option><option value="CT">Class Teacher</option><option value="TR">Subject Room Teacher</option><option value="HOS">Head of School (HOS)</option><option value="HOD">HOD</option><option value="BURSAR">Bursar</option><option value="DEPUTY">Deputy</option><option value="LIBRARIAN">Librarian</option><option value="SECRETARY">Secretary</option><option value="PRINCIPAL">Principal</option><option value="LEARNER">Learner</option><option value="PARENT">Parent</option></select></div><div class="form-group"><label>School Code</label><input id="loginCode" placeholder="e.g. KIRWADIGITAL"></div><div class="form-group"><label>Staff email</label><input id="loginEmail" type="email" placeholder="name@example.com"></div><div class="form-group"><label>Personal Access Password</label><input id="loginPass" type="password"></div><div class="form-group"><label>Master School Security Password</label><input id="loginMaster" type="password"></div><button onclick="login()">Access Secure Portal Room</button></div>
<div id="registerPanel" class="hidden"><div class="alert">The Head of Examination must register the school first. Use a dedicated password, not your Gmail password.</div><div class="form-group"><label>Unique School Code</label><input id="regCode" placeholder="e.g. KIRWAPRIMARY"></div><div class="form-group"><label>Official School Name</label><input id="regName" placeholder="School name"></div><div class="form-group"><label>HOE email</label><input id="regEmail" type="email"></div><div class="form-group"><label>HOE Access Password</label><input id="regPass" type="password"></div><div class="form-group"><label>Master School Password</label><input id="regMaster" type="password"></div><button class="success" onclick="registerSchool()">Initialize School Account</button></div></section>
<section id="portal" class="hidden"><div class="card" style="display:flex;justify-content:space-between;align-items:center;background:var(--secondary);color:white"><div><b id="userDisplay"></b><div id="schoolDisplay" class="muted" style="color:#cbd5e1"></div></div><button class="danger small" onclick="logout()">Exit Secure Node</button></div><div id="modules"></div></section></div>
<script>
'use strict';
const STORE='kirwa_analytics_v3_schools';let current={code:null,role:null,email:null},historyViews=[],historyIndex=-1,activeTab='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function allSchools(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}function saveSchools(x){localStorage.setItem(STORE,JSON.stringify(x))}function school(){return allSchools()[current.code]}function saveSchool(s){let a=allSchools();a[current.code]=s;saveSchools(a)}function msg(t){$('notice').textContent=t;$('notice').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}function hideMsg(){$('notice').classList.add('hidden')}
function showAuth(t){$('loginPanel').classList.toggle('hidden',t!=='login');$('registerPanel').classList.toggle('hidden',t!=='register');$('loginTab').classList.toggle('active',t==='login');$('regTab').classList.toggle('active',t==='register')}
function registerSchool(){let code=$('regCode').value.trim().toUpperCase(),name=$('regName').value.trim(),email=$('regEmail').value.trim().toLowerCase(),pass=$('regPass').value,master=$('regMaster').value;if(!code||!name||!email||!pass||!master)return alert('Complete all registration fields.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return alert('Enter a valid email address.');let a=allSchools();if(a[code])return alert('That school code is already registered.');const trialStart=new Date(),trialEnd=new Date(trialStart.getTime()+60*24*60*60*1000);a[code]={code,name,master,hoe:{email,pass},staff:[],classes:{},exams:[],locked:false,broadcasts:[],subscriptions:{school:null,learners:{},parents:{},payments:[],trialStart:trialStart.toISOString(),trialEndsAt:trialEnd.toISOString()}};saveSchools(a);alert('School registered successfully. Your school has a 2-month free subscription trial starting today. Sign in as HOE.');showAuth('login');$('loginCode').value=code;$('loginRole').value='HOE';$('loginEmail').value=email}
function login(){let role=$('loginRole').value,code=$('loginCode').value.trim().toUpperCase(),email=$('loginEmail').value.trim().toLowerCase(),pass=$('loginPass').value,master=$('loginMaster').value,s=allSchools()[code];if(!code||!email||!pass||!master)return alert('Enter all sign-in details.');if(!s)return alert('School code not found on this device.');if(master!==s.master)return alert('Incorrect master school password.');let valid=role==='HOE'?s.hoe.email===email&&s.hoe.pass===pass:(s.staff||[]).some(x=>x.role===role&&x.email===email&&x.pass===pass);if(!valid)return alert('Staff account details are incorrect or not registered. Ask the HOE to create your staff account.');current={code,role,email};$('auth').classList.add('hidden');$('portal').classList.remove('hidden');$('userDisplay').textContent=role+' : '+email;$('schoolDisplay').textContent='School Node: '+code+' ('+s.name+')';historyViews=[];historyIndex=-1;render();pushHistory();hideMsg()}
function logout(){current={code:null,role:null,email:null};$('portal').classList.add('hidden');$('auth').classList.remove('hidden');$('modules').innerHTML='';historyViews=[];historyIndex=-1}
function pushHistory(){let snap={role:current.role,tab:activeTab};historyViews=historyViews.slice(0,historyIndex+1);historyViews.push(snap);historyIndex=historyViews.length-1}function goBack(){if(historyIndex>0){historyIndex--;activeTab=historyViews[historyIndex].tab;render()}else msg('No previous workspace view.')}function goForward(){if(historyIndex<historyViews.length-1){historyIndex++;activeTab=historyViews[historyIndex].tab;render()}else msg('No next workspace view.')}
function pct(raw,out){return out>0?Math.round(Number(raw)/Number(out)*100):0}function grade(p,sys){if(sys==='CBC'){if(p>=85)return'EE1';if(p>=73)return'EE2';if(p>=60)return'ME1';if(p>=48)return'ME2';if(p>=36)return'AE1';if(p>=24)return'AE2';if(p>=15)return'BE1';return'BE2'}if(p>=80)return'A';if(p>=75)return'A−';if(p>=70)return'B+';if(p>=65)return'B';if(p>=60)return'B−';if(p>=55)return'C+';if(p>=50)return'C';if(p>=45)return'C−';if(p>=40)return'D+';if(p>=35)return'D';if(p>=30)return'D−';return'E'}
function gradePoints(p,sys){let g=grade(p,sys);if(sys==='CBC')return ({EE1:8,EE2:7,ME1:6,ME2:5,AE1:4,AE2:3,BE1:2,BE2:1})[g]||0;return ({A:12,'A−':11,'B+':10,B:9,'B−':8,'C+':7,C:6,'C−':5,'D+':4,D:3,'D−':2,E:1})[g]||0}
function render(){let s=school();if(!s)return logout();if(current.role==='HOE')renderHOE(s);else if(current.role==='CT')renderCT(s);else if(current.role==='TR')renderTR(s);else renderHOS(s)}
function tab(name){activeTab=name;render();pushHistory()}
function renderHOE(s){$('modules').innerHTML=`<div class="card"><h3>HOE Administrative Workspace Panel</h3><div class="nav-tabs"><button class="tab-btn ${activeTab==='classes'?'active':''}" onclick="tab('classes')">Structure Setup</button><button class="tab-btn ${activeTab==='staff'?'active':''}" onclick="tab('staff')">Staff Accounts</button><button class="tab-btn ${activeTab==='exams'?'active':''}" onclick="tab('exams')">Assessment Cycles</button><button class="tab-btn ${activeTab==='audit'?'active':''}" onclick="tab('audit')">Audit & Locking</button><button class="tab-btn ${activeTab==='comms'?'active':''}" onclick="tab('comms')">Announcements</button></div><div id="hoeContent">${hoeContent(s)}</div></div>`}
function hoeContent(s){if(activeTab==='staff')return `<h4 class="section-title">Create staff login accounts</h4><div class="grid"><div class="form-group"><label>Staff email</label><input id="staffEmail" type="email"></div><div class="form-group"><label>Temporary access password</label><input id="staffPass" type="password"></div><div class="form-group"><label>Role</label><select id="staffRole"><option value="CT">Class Teacher</option><option value="TR">Subject Teacher</option><option value="HOS">Head of School</option></select></div></div><button onclick="addStaff()">Create Staff Account</button>${table(['Email','Role'],(s.staff||[]).map(x=>[esc(x.email),esc(x.role)]))}`;
if(activeTab==='exams')return `<h4 class="section-title">Deploy assessment window</h4><div class="grid"><div class="form-group"><label>Exam name</label><input id="examName" placeholder="Mid-Term Examination"></div><div class="form-group"><label>Term</label><select id="examTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div class="form-group"><label>Exam type</label><select id="examType"><option>Regular</option><option>End-Term Combined</option><option>Speed Test</option><option>SPA</option></select></div></div><button onclick="addExam()">Create Assessment Cycle</button>${table(['Exam','Term','Type'],s.exams.map(e=>[esc(e.name),esc(e.term),esc(e.type)]))}`;
if(activeTab==='audit')return `<h4 class="section-title">School data audit</h4><p>School lock status: <b>${s.locked?'LOCKED':'UNLOCKED'}</b></p><div class="actions"><button class="${s.locked?'success':'danger'}" onclick="toggleLock()">${s.locked?'Unlock Marks Entry':'Lock Marks Entry'}</button><button class="secondary" onclick="downloadSchoolBackup()">Download Data Backup</button><button class="danger" onclick="resetSchool()">Reset Entire School Structure</button></div><p class="muted">Locking prevents teachers from entering or changing marks.</p>`;
if(activeTab==='comms')return `<h4 class="section-title">Staff announcement board</h4><textarea id="broadcastMsg" rows="3" placeholder="Write a school announcement..."></textarea><button onclick="broadcast()">Publish Announcement</button>${(s.broadcasts||[]).slice().reverse().map(b=>`<div class="alert" style="margin-top:8px">${esc(b.msg)}<div class="muted">${esc(b.date)}</div></div>`).join('')}`;
return `<div class="grid"><div class="card"><h4>Add Class / Stream</h4><div class="form-group"><label>Class identifier</label><input id="className" placeholder="Grade 10 East / Form 1 West"></div><div class="form-group"><label>Curriculum</label><select id="classSystem"><option value="CBC">CBE / CBC</option><option value="844">8-4-4</option></select></div><div class="form-group"><label>Pathway (CBE)</label><select id="pathway"><option>STEM</option><option>Social Sciences</option><option>Arts & Sports Science</option></select></div><div class="form-group"><label>Subjects (comma separated)</label><textarea id="classSubjects" rows="3" placeholder="English, Mathematics, Biology"></textarea></div><button onclick="addClass()">Register Class Stream</button></div></div><h4>Registered classes</h4>${table(['Class','System','Pathway','Subjects','Learners'],Object.entries(s.classes).map(([n,c])=>[esc(n),esc(c.system),esc(c.pathway||'—'),esc(c.subjects.join(', ')),Object.keys(c.students).length]))}`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No records available.</td></tr>`}</tbody></table></div>`}
function addClass(){let n=$('className').value.trim(),sys=$('classSystem').value,subjects=$('classSubjects').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!subjects.length)return alert('Enter a class name and at least one subject.');let s=school();if(s.classes[n])return alert('Class already exists.');s.classes[n]={system:sys,pathway:sys==='CBC'?$('pathway').value:'',subjects:[...new Set(subjects)],students:{}};saveSchool(s);render();msg('Class stream registered.')}
function addLearner(){let cls=$('learnerClass').value,adm=$('learnerAdm').value.trim(),name=$('learnerName').value.trim();if(!cls||!adm||!name)return alert('Complete learner details.');let s=school();if(!s.classes[cls])return alert('Select a valid class.');if(s.classes[cls].students[adm])return alert('Admission number already exists in this class.');s.classes[cls].students[adm]={adm,name,marks:{}};saveSchool(s);render();msg('Learner registered successfully.')}
function addStaff(){let email=$('staffEmail').value.trim().toLowerCase(),pass=$('staffPass').value,role=$('staffRole').value;if(!email||!pass)return alert('Enter staff email and password.');let s=school();if(s.staff.some(x=>x.email===email))return alert('Staff email already registered.');s.staff.push({email,pass,role});saveSchool(s);render();msg('Staff account created. Share login details securely.')}
function addExam(){let name=$('examName').value.trim(),term=$('examTerm').value,type=$('examType').value;if(!name)return alert('Enter an exam name.');let s=school();if(s.exams.some(e=>e.name.toLowerCase()===name.toLowerCase()))return alert('An exam with this name already exists.');s.exams.push({name,term,type,date:new Date().toLocaleDateString()});saveSchool(s);render();msg('Assessment cycle created.')}
function toggleLock(){let s=school();s.locked=!s.locked;saveSchool(s);render();msg(s.locked?'Marks entry locked.':'Marks entry unlocked.')}
function broadcast(){let m=$('broadcastMsg').value.trim();if(!m)return alert('Write an announcement first.');let s=school();s.broadcasts.push({msg:m,date:new Date().toLocaleString()});saveSchool(s);render();msg('Announcement published.')}
function resetSchool(){if(!confirm('This permanently removes all classes, learners, marks, exams and announcements for this school on this device. Continue?'))return;let s=school();s.classes={};s.exams=[];s.broadcasts=[];s.locked=false;saveSchool(s);render();msg('School structure reset. School login remains active.')}
function classOptions(s){return Object.keys(s.classes).map(c=>`<option>${esc(c)}</option>`).join('')}
function renderTR(s){$('modules').innerHTML=`<div class="card"><h3>Subject Teacher Workspace</h3><div class="grid"><div class="form-group"><label>Class / Stream</label><select id="trClass" onchange="populateSubjects()">${classOptions(s)}</select></div><div class="form-group"><label>Subject</label><select id="trSubject"></select></div><div class="form-group"><label>Assessment</label><select id="trExam">${s.exams.map(e=>`<option value="${esc(e.name)}">${esc(e.name)} — ${esc(e.term)}</option>`).join('')}</select></div><div class="form-group"><label>Maximum marks</label><input id="trOut" type="number" min="1" value="100"></div></div><button onclick="loadLedger()">Load Marks Entry Ledger</button><div id="ledger" class="card" style="margin-top:12px">Select a class, subject and assessment.</div></div>`;populateSubjects()}
function populateSubjects(){let s=school(),c=$('trClass')?.value,el=$('trSubject');if(!el)return;el.innerHTML=(s.classes[c]?.subjects||[]).map(x=>`<option>${esc(x)}</option>`).join('')||'<option value="">No subjects</option>'}
function loadLedger(){let s=school(),cls=$('trClass').value,sub=$('trSubject').value,ex=$('trExam').value,out=Number($('trOut').value);if(s.locked)return alert('Marks entry is locked by HOE.');if(!cls||!sub||!ex||!Number.isFinite(out)||out<=0)return alert('Complete the marks configuration.');let learners=Object.values(s.classes[cls].students);if(!learners.length){$('ledger').innerHTML='No learners registered in this class.';return}let rows=learners.map(st=>{let v=st.marks[ex]?.[sub]?.raw??'';return `<tr><td>${esc(st.adm)}</td><td>${esc(st.name)}</td><td><input type="number" min="0" max="${out}" step="any" class="markInput" data-adm="${esc(st.adm)}" value="${v}" style="max-width:110px"></td><td>${v===''?'—':pct(v,out)+'%'}</td></tr>`}).join('');$('ledger').innerHTML=`<h4>${esc(cls)} — ${esc(sub)} — ${esc(ex)} (out of ${out})</h4>${table(['ADM','Learner','Mark','Current %'],[]).replace('<tbody><tr><td colspan="4">No records available.</td></tr></tbody>',`<tbody>${rows}</tbody>`)}<button class="success" onclick="saveMarks('${encodeURIComponent(cls)}','${encodeURIComponent(ex)}','${encodeURIComponent(sub)}')">Save Marks</button>`;window.currentOut=out}
function saveMarks(cls0,ex0,sub0){let cls=decodeURIComponent(cls0),ex=decodeURIComponent(ex0),sub=decodeURIComponent(sub0),out=Number(window.currentOut),inputs=[...document.querySelectorAll('.markInput')];if(school().locked)return alert('Marks entry is locked.');for(let i of inputs){if(i.value!==''&&(!Number.isFinite(Number(i.value))||Number(i.value)<0||Number(i.value)>out))return alert('Every mark must be between 0 and '+out+'.')}let s=school();inputs.forEach(i=>{let st=s.classes[cls].students[i.dataset.adm];if(!st.marks[ex])st.marks[ex]={};if(i.value==='')delete st.marks[ex][sub];else st.marks[ex][sub]={raw:Number(i.value),outOf:out,pct:pct(i.value,out)}});saveSchool(s);alert('Marks saved and percentages calculated.');loadLedger()}
function renderCT(s){$('modules').innerHTML=`<div class="card"><h3>Class Teacher Workspace</h3><div class="grid"><div><h4>Register a class / stream</h4><label>Class (e.g. Grade 10 East or Form 2 West)</label><input id="ctNewClass"><label>Curriculum</label><select id="ctNewSystem" onchange="document.getElementById('ctPathwayWrap').style.display=this.value==='CBC'?'block':'none'"><option value="CBC">CBE / CBC</option><option value="844">8-4-4</option></select><div id="ctPathwayWrap"><label>Pathway (CBE only)</label><select id="ctNewPathway"><option>STEM</option><option>Social Sciences</option><option>Arts and Sports Science</option></select></div><label>Subjects (comma separated)</label><textarea id="ctNewSubjects"></textarea><button onclick="ctAddClass()">Register Class</button></div><div><h4>Register learner</h4><label>Class / Stream</label><select id="ctClass" onchange="showClassRoster()">${classOptions(s)}</select><label>Admission number</label><input id="ctAdm"><label>Learner full name</label><input id="ctName"><div id="ctCbeFields"><label>CBE Assessment Number (CBE only)</label><input id="ctAssessment"><label>Pathway</label><select id="ctLearnerPathway"><option>STEM</option><option>Social Sciences</option><option>Arts and Sports Science</option></select></div><label>Parent / Guardian phone</label><input id="ctParentPhone" type="tel" placeholder="07XXXXXXXX"><button onclick="ctAddLearner()">Register Learner</button></div></div><div class="form-group"><label>Select class roster</label><select id="ctRosterClass" onchange="showClassRoster()">${classOptions(s)}</select></div><div id="ctRoster"></div><div id="ctReleased"></div></div>`;let el=$('ctRosterClass');if(el)$('ctClass').value=el.value;showClassRoster();showCTReleased()}
function ctAddClass(){let s=school(),n=$('ctNewClass').value.trim(),sys=$('ctNewSystem').value,subjects=$('ctNewSubjects').value.split(',').map(x=>x.trim()).filter(Boolean);if(!n||!subjects.length)return alert('Enter class name and subjects.');if(s.classes[n])return alert('That class already exists.');s.classes[n]={system:sys,pathway:sys==='CBC'?$('ctNewPathway').value:'',subjects:[...new Set(subjects)],students:{},teacher:current.email};saveSchool(s);render();msg('Class registered. HOS can now see it in the school class list.')}
function ctAddLearner(){let s=school(),cls=$('ctClass').value,c=s.classes[cls],adm=$('ctAdm').value.trim(),name=$('ctName').value.trim(),phone=$('ctParentPhone').value.trim();if(!c||!adm||!name||!phone)return alert('Complete class, admission number, learner name and parent phone.');if(c.students[adm])return alert('Admission number already exists in this class.');let cbe=c.system==='CBC',assessment=cbe?$('ctAssessment').value.trim():'',pathway=cbe?$('ctLearnerPathway').value:'';if(cbe&&!assessment)return alert('CBE assessment number is required.');c.students[adm]={adm,name,className:cls,parentPhone:phone,assessmentNumber:assessment,pathway,marks:{},released:{}};saveSchool(s);render();msg('Learner registered successfully.')}
function showCTReleased(){let s=school(),cls=$('ctClass')?.value||$('ctRosterClass')?.value;if(!$('ctReleased'))return;let c=s.classes[cls];if(!c)return;$('ctReleased').innerHTML='<h4>Released report forms</h4>'+s.exams.filter(e=>e.released&&e.releasedClasses?.includes(cls)).map(e=>`<div class="alert">${esc(e.name)} — results released <button class="small" onclick="printClassReports('${encodeURIComponent(cls)}','${encodeURIComponent(e.name)}')">Print class report forms</button></div>`).join('')||'<p class="muted">No released report forms yet.</p>'}
function showClassRoster(){let s=school(),c=$('ctClass')?.value||$('ctRosterClass')?.value;if(!c||!s.classes[c]){$('ctRoster').innerHTML='No class selected.';return}if($('ctRosterClass'))$('ctRosterClass').value=c;let cls=s.classes[c],students=Object.values(cls.students);$('ctRoster').innerHTML=`<h4>${esc(c)} — Learner Roster (${students.length})</h4>${table(['ADM','Learner','Assessment No.','Parent phone','Pathway'],students.map(st=>[esc(st.adm),esc(st.name),esc(st.assessmentNumber||'—'),esc(st.parentPhone||'—'),esc(cls.system==='CBC'?(st.pathway||cls.pathway||'—'):'Not applicable')]))}<button class="secondary" onclick="downloadClassReport('${encodeURIComponent(c)}')">Download Class Roster</button><p class="muted">SMS requires your phone messaging app or a connected SMS gateway. This offline version prepares messages for review; it cannot silently send bulk SMS.</p><button onclick="sendClassMarks('${encodeURIComponent(c)}')">Prepare marks SMS for parents</button>`;showCTReleased()}
function sendClassMarks(c0){let cls=decodeURIComponent(c0),s=school(),c=s.classes[cls],exam=prompt('Enter the exact examination name to send:');if(!exam)return;let links=[];Object.values(c.students).forEach(st=>{let ex=st.marks[exam]||{},items=Object.entries(ex).map(([sub,m])=>sub+': '+m.raw+'/'+m.outOf).join(', ');if(st.parentPhone&&items)links.push({phone:st.parentPhone,text:`${s.name}: Results for ${st.name} (${st.adm}), ${exam}. ${items}. Please contact the school for clarification.`})});if(!links.length)return alert('No parent phone numbers or saved marks found.');let first=links[0];if(links.length>1){alert('Your phone will open its SMS app for each parent. SMS is not sent automatically by this offline website; review and tap Send for each message.');}links.forEach((x,i)=>{let url='sms:'+encodeURIComponent(x.phone)+'?body='+encodeURIComponent(x.text);if(i===0)window.location.href=url;else setTimeout(()=>window.open(url,'_blank'),i*900)});}
function downloadClassReport(c0){let c=decodeURIComponent(c0),s=school(),cls=s.classes[c];let body=`<h3>${esc(c)} Learner Roster</h3>${table(['ADM','Learner','Assessment No.','Parent phone'],Object.values(cls.students).map(x=>[esc(x.adm),esc(x.name),esc(x.assessmentNumber||'—'),esc(x.parentPhone||'—')]))}`;printReport('Class Roster',body)}
function printClassReports(c0,e0){let cls=decodeURIComponent(c0),exam=decodeURIComponent(e0),s=school(),c=s.classes[cls],html=Object.values(c.students).map(st=>reportFormHTML(s,c,st,exam)).join('');printReport('Learner Report Forms — '+cls,html)}
function reportFormHTML(s,c,st,exam){let marks=st.marks[exam]||{},rows=c.subjects.map(sub=>{let m=marks[sub],p=m?m.pct:null;return [esc(sub),m?m.raw+'/'+m.outOf:'Missing',m?grade(p,c.system):'—',m?p+'%':'—']});let vals=Object.values(marks),total=vals.reduce((a,m)=>a+Number(m.raw),0),out=vals.reduce((a,m)=>a+Number(m.outOf),0),average=out?Math.round(total/out*100):0,level=grade(average,c.system),points=vals.reduce((a,m)=>a+gradePoints(m.pct,c.system),0),klass=c.system==='CBC'?(average>=85?'report-ee1':average>=73?'report-ee2':average>=60?'report-me':average>=36?'report-ae':'report-be'):(average>=75?'report-ee1':average>=60?'report-me':average>=40?'report-ae':'report-be');return `<section class="report-sheet ${klass}"><div class="release-head"><h2>${esc(s.name)}</h2><h3>LEARNER ACADEMIC REPORT</h3><b>${esc(exam)} | ${esc(c.system==='CBC'?'CBE / CBC':'8-4-4')}</b></div><div class="meta"><div>Learner: <b>${esc(st.name)}</b></div><div>Admission No: <b>${esc(st.adm)}</b></div><div>Class: <b>${esc(st.className||'')}</b></div><div>Assessment No: <b>${esc(c.system==='CBC'?st.assessmentNumber||'—':'Not applicable')}</b></div><div>Pathway: <b>${esc(c.system==='CBC'?st.pathway||c.pathway||'—':'Not applicable')}</b></div><div>Parent phone: <b>${esc(st.parentPhone||'—')}</b></div></div>${table(['Learning Area / Subject','Mark','Grade / Level','Percentage'],rows)}<p><b>Total:</b> ${total}/${out||'—'} &nbsp; <b>Average:</b> ${average}% &nbsp; <b>Achievement:</b> ${esc(level)} &nbsp; <b>Mean points:</b> ${points}/${c.subjects.length*(c.system==='CBC'?8:12)}</p><p>Class teacher comment: __________________________________________</p><p>HOD / Headteacher comment: ______________________________________</p><div class="release-foot"><span>Class Teacher: __________________</span><span>Headteacher: __________________</span></div></section>`}
function renderHOS(s){let classes=Object.entries(s.classes);$('modules').innerHTML=`<div class="card"><h3>Head of School — Examination Control</h3><div class="grid"><div class="stat"><b>${classes.length}</b>Classes / streams</div><div class="stat"><b>${classes.reduce((n,[k,c])=>n+Object.keys(c.students).length,0)}</b>Learners</div><div class="stat"><b>${s.exams.length}</b>Examinations</div></div><h4>Classes grouped by curriculum and grade/form</h4>${table(['Curriculum','Grade / Form / Stream','Learners','Subjects'],classes.map(([n,c])=>[c.system==='CBC'?'CBE / CBC':'8-4-4',esc(n),Object.keys(c.students).length,esc(c.subjects.join(', '))]))}<h4>Examination release control</h4>${s.exams.map((e,i)=>`<div class="card"><b>${esc(e.name)}</b> — ${esc(e.term)}<p>${e.released?'Released':'Not released'}</p><button onclick="hosReleaseExam(${i})" ${e.released?'disabled':''}>${e.released?'Results Released':'Check missing marks and release results'}</button>${e.released?'<button class="secondary" onclick="downloadMeritAll('+i+')">Download released school merit lists</button>':''}</div>`).join('')}<h4>Missing Marks Audit</h4>${missingAudit(s)}<button class="secondary" onclick="downloadSchoolBackup()">Download Data Backup</button></div>`}
function hosReleaseExam(i){let s=school(),e=s.exams[i],missing=[];Object.entries(s.classes).forEach(([cls,c])=>Object.values(c.students).forEach(st=>c.subjects.forEach(sub=>{if(!st.marks[e.name]?.[sub])missing.push(cls+' — '+st.name+' — '+sub)})));if(missing.length){alert('Cannot release. Missing marks found ('+missing.length+'). First missing: '+missing.slice(0,8).join('; '));return}if(!confirm('All class subject marks are present. Release '+e.name+' results and make report forms available to class teachers?'))return;e.released=true;e.releaseDate=new Date().toLocaleString();e.releasedClasses=Object.keys(s.classes);saveSchool(s);render();msg('Results released. Class teachers can now print learner report forms; merit lists are available here.')}
function downloadMeritAll(i){let s=school(),e=s.exams[i];if(!e?.released)return alert('Release results first.');Object.entries(s.classes).forEach(([cls,c])=>{let sys=c.system,students=Object.values(c.students).map(st=>{let vals=c.subjects.map(sub=>st.marks[e.name]?.[sub]),raw=vals.reduce((a,m)=>a+(m?Number(m.raw):0),0),out=vals.reduce((a,m)=>a+(m?Number(m.outOf):0),0),avg=out?Math.round(raw/out*100):0;let points=vals.reduce((a,m)=>a+(m?gradePoints(m.pct,sys):0),0);return {st,raw,out,avg,level:grade(avg,sys),points,vals}}).sort((a,b)=>b.avg-a.avg);let body=`<div class="release-head"><h1>${esc(s.name)}</h1><h2>OFFICIAL EXAMINATION RESULTS & SCHOOL MERIT LIST</h2><h3>${esc(cls)} — ${esc(sys==='CBC'?'CBE / CBC':'8-4-4')} — ${esc(e.name)}</h3><p>Released: ${esc(e.releaseDate||'')}</p></div>${table(['Pos.','Admission No.','Learner Name',...c.subjects.map(esc),'Total','Average','Grade / Level','Mean points'],students.map((x,j)=>[j+1,esc(x.st.adm),esc(x.st.name),...x.vals.map(m=>m?m.raw:'—'),x.raw+'/'+x.out,x.avg+'%',esc(x.level),x.points+'/'+(c.subjects.length*(sys==='CBC'?8:12))]))}<div class="release-foot"><span>HOD: ____________________</span><span>Headteacher: ____________________</span></div><p style="text-align:center;margin-top:20px">OFFICIAL SCHOOL RESULT RELEASE DOCUMENT</p>`;printReport('Merit List — '+cls+' — '+e.name,body)})}
function missingAudit(s){let rows=[];Object.entries(s.classes).forEach(([cls,c])=>Object.values(c.students).forEach(st=>s.exams.forEach(ex=>c.subjects.forEach(sub=>{if(!st.marks[ex.name]?.[sub])rows.push([esc(st.adm),esc(st.name),esc(cls),esc(ex.name),esc(sub)])}))));return table(['ADM','Learner','Class','Exam','Missing subject'],rows)}
function reportHTML(title,body){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial;padding:25px;color:#111}h1,h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{border:1px solid #555;padding:7px;text-align:left}th{background:#eee}.meta{margin:20px 0}.report-ee1{border:5px double #15803d;background:#f0fdf4}.report-ee2{border:5px double #0f766e;background:#f0fdfa}.report-me{border:5px solid #2563eb;background:#eff6ff}.report-ae{border:5px solid #d97706;background:#fffbeb}.report-be{border:5px solid #64748b;background:#f8fafc}.release-head{text-align:center;border-bottom:3px double #334155;padding:12px;margin-bottom:12px}.release-foot{margin-top:24px;display:flex;justify-content:space-between}.pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#e2e8f0;font-weight:bold}.report-sheet{padding:22px;border-radius:12px;page-break-after:always}.report-sheet h2,.report-sheet h3{text-align:center;margin:8px}.report-sheet table{font-size:12px}.report-sheet th{background:#dbeafe}.report-sheet .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}@media print{body{background:#fff}.report-sheet{box-shadow:none;break-after:page}}
</style></head><body><h1>KIRWA ANALYTICS</h1><h2>${esc(title)}</h2><p class="meta">School: ${esc(school().name)} | School code: ${esc(current.code)} | Generated: ${new Date().toLocaleString()}</p>${body}<script>window.onload=()=>window.print()<\/script></body></html>`}
function printReport(title,body){let w=window.open('','_blank');if(!w){alert('Allow pop-ups to print or save the report as PDF.');return}w.document.open();w.document.write(reportHTML(title,body));w.document.close()}
function downloadClassReport(c0){let c=decodeURIComponent(c0),s=school(),cls=s.classes[c];let body=`<h3>${esc(c)} Learner Roster</h3>${table(['ADM','Learner'],Object.values(cls.students).map(x=>[esc(x.adm),esc(x.name)]))}`;printReport('Class Roster',body)}
function downloadSchoolReport(){let s=school(),rows=[];Object.entries(s.classes).forEach(([cls,c])=>Object.values(c.students).forEach(st=>{let v=[];Object.values(st.marks).forEach(ex=>Object.values(ex).forEach(m=>v.push(m.pct)));let mean=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;rows.push([esc(st.adm),esc(st.name),esc(cls),mean+'%',grade(mean,c.system)])}));rows.sort((a,b)=>parseInt(b[3])-parseInt(a[3]));printReport('School Performance Report',table(['ADM','Learner','Class','Mean','Level'],rows))}
